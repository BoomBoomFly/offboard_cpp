/**:
  ros__parameters:
    # 消息超时设置 (单位: 秒)
    msg_timeout:
      rc: 0.5             # 遥控器信号超时
      odom: 0.5           # 里程计 (T265/VIO) 超时
      offboard: 0.5       # Offboard 控制指令频率检查
      offboardMode: 0.5   # Offboard 模式反馈超时
      bat: 0.5            # 电池状态回调超时

    # 自动起飞与降落设置
    takeoff_land:
      enable: true        # 是否启用自动起降逻辑
      enable_arm: false   # production defaults disarmed; explicit reviewed enable required

    # 完整任务轨迹参数（由 flight_sequence_node 直接读取）
    mission:
      task_id: 3
      # Must equal mission_bridge uint32 source_epoch; zero intentionally fails closed.
      expected_source_epoch: 0
      takeoff_speed: 0.3
      cruise_speed: 1.0
      home_land_speed: 0.2
      platform_land_speed: 0.2
      takeoff_height: 0.5
      hover_seconds: 3.0
      platform_hold_seconds: 5.0
      position_tolerance: 0.2
      home_surface_z: 0.0
      platform_surface_z: 0.0
      follow_offset_x: 0.0
      follow_offset_y: 0.0
      yaw: 0.0

    freshness:
      odometry_ns: 200000000
      rc_ns: 300000000
      timesync_ns: 2500000000
      vehicle_status_ns: 1200000000
      land_detected_ns: 1800000000
      setpoint_ns: 150000000
      mode_ns: 150000000
      operator_ns: 300000000
      authority_ns: 500000000
      mission_input_ns: 500000000

    safety:
      timestamp_max_age_us: 2000000
      timestamp_max_future_us: 100000

    landing:
      stable_ns: 1000000000
      minimum_samples: 2
      max_vertical_speed: 0.15
      height_tolerance: 0.25

    authority:
      input_freshness_ns: 300000000

    # G1 measured RC semantics (zero-based RcChannels indices):
    # CH6 +1 = application activation; CH7 +1 = human arm permission;
    # CH8 +1 = kill. A 0.5 threshold separates the three-position levels.
    rc_operator:
      edge_hold_ns: 200000000
      kill_channel: 7
      activation_channel: 5
      arm_enable_channel: 6
      kill_threshold: 0.5
      activation_threshold: 0.5
      arm_enable_threshold: 0.5

    # 安全阈值与保护
    low_voltage: 13.2     # 低电压报警阈值 (针对 4S 电池)
    odom_pos_jump: 0.3    # 里程计位置跳变容忍度 (米)，超过此值触发异常保护

    # 遥控器 (RC) 调试与通道映射
    rc_debug:
      # 通道映射 (根据你的遥控器设置进行修改，通常 5, 6, 7, 8 为开关通道)
      ch_p: 5             # 用于动态调节 P 参数的通道
      ch_i: 6             # 用于动态调节 I 参数的通道
      ch_d: 7             # 用于动态调节 D 参数的通道
      ch_mode: 8          # 模式切换通道 (悬浮模式)
      ch_gear: 9          # 档位切换通道 (Offboard 模式)

      # 初始控制参数 (这些动态参数由 offboard_node 在启动时声明)
      # 程序启动时会首先读取这里的数值
      p: 1.5              # 默认比例系数
      i: 0.01             # 默认积分系数
      d: 0.15             # 默认微分系数
